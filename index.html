<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبة الروايات الاحترافية</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    /* Container & Layout */
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .hero-section {
      text-align: center;
      margin-bottom: 3rem;
    }

    .hero-section h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .hero-section p {
      color: var(--text-muted);
    }

    /* Grid System */
    .novels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2rem;
    }

    /* Card Styling */
    .novel-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .novel-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(139, 92, 246, 0.15);
    }

    .novel-cover {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background-color: var(--border-color);
    }

    .novel-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .novel-tag {
      align-self: flex-start;
      background: rgba(139, 92, 246, 0.2);
      color: var(--accent);
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .novel-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    .novel-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      border: 1px solid var(--border-color);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: white;
      outline: none;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--accent);
    }

    .loading-text {
      text-align: center;
      grid-column: 1 / -1;
      padding: 3rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-book-open"></i> عالم الروايات
    </div>
    <button class="btn-primary" onclick="openModal()">
      <i class="fa-solid fa-plus"></i> إضافة رواية
    </button>
  </header>

  <!-- Content Container -->
  <main class="container">
    <section class="hero-section">
      <h1>استكشف أحدث الروايات المترجمة</h1>
      <p>قاعدة بيانات متصلة مباشرة عبر Supabase</p>
    </section>

    <!-- Grid Container for Novels -->
    <div id="novels-grid" class="novels-grid">
      <div class="loading-text">جاري تحميل الروايات...</div>
    </div>
  </main>

  <!-- Add Novel Modal -->
  <div id="novel-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>إضافة رواية جديدة</h3>
        <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closeModal()"></i>
      </div>
      <form id="add-novel-form" onsubmit="handleAddNovel(event)">
        <div class="form-group">
          <label>عنوان الرواية</label>
          <input type="text" id="title" required placeholder="مثال: Lord of the Mysteries">
        </div>
        <div class="form-group">
          <label>التصنيف</label>
          <input type="text" id="category" placeholder="مثال: الفانتازيا / غموض">
        </div>
        <div class="form-group">
          <label>رابط الصورة (URL)</label>
          <input type="url" id="cover_image" placeholder="https://example.com/image.jpg">
        </div>
        <div class="form-group">
          <label>الوصف</label>
          <textarea id="description" rows="3" placeholder="نبذة مختصرة عن الرواية..."></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">حفظ الرواية</button>
      </form>
    </div>
  </div>

  <script>
    // Supabase Credentials
    const SUPABASE_URL = 'https://jsbgyjoxpnfydlpwisx.supabase.co';
    const SUPABASE_KEY = 'Sb_publishable_NyijmSc1_VEA4Ga7glmguw_wX9Ss_oe';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Fetch and Render Novels
    async function fetchNovels() {
      const grid = document.getElementById('novels-grid');
      
      const { data: novels, error } = await supabaseClient
        .from('novels')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        grid.innerHTML = `<div class="loading-text">حدث خطأ أثناء تحميل البيانات: ${error.message}</div>`;
        return;
      }

      if (!novels || novels.length === 0) {
        grid.innerHTML = `<div class="loading-text">لا توجد روايات مضافة حالياً. كن أول من يضيف رواية!</div>`;
        return;
      }

      grid.innerHTML = novels.map(novel => `
        <div class="novel-card">
          <img src="${novel.cover_image || 'https://via.placeholder.com/300x400?text=No+Cover'}" class="novel-cover" alt="${novel.title}">
          <div class="novel-info">
            <span class="novel-tag">${novel.category || 'عام'}</span>
            <h3 class="novel-title">${novel.title}</h3>
            <p class="novel-desc">${novel.description || 'لا يوجد وصف متوفر.'}</p>
          </div>
        </div>
      `).join('');
    }

    // Handle Add Novel Form
    async function handleAddNovel(e) {
      e.preventDefault();
      
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const cover_image = document.getElementById('cover_image').value;
      const description = document.getElementById('description').value;

      const { data, error } = await supabaseClient
        .from('novels')
        .insert([{ title, category, cover_image, description }]);

      if (error) {
        alert('خطأ في إضافة الرواية: ' + error.message);
      } else {
        closeModal();
        document.getElementById('add-novel-form').reset();
        fetchNovels();
      }
    }

    function openModal() { document.getElementById('novel-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('novel-modal').style.display = 'none'; }

    fetchNovels();
  </script>
</body>
</html>
