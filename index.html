<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجرّة الروايات</title>
    <!-- استدعاء مكتبة Tailwind CSS للتصميم الاحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء مكتبة الخلفية المتحركة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <!-- خلفية الفضاء المتحركة -->
    <div id="vanta-bg" class="fixed inset-0 -z-10"></div>

    <!-- شريط التنقل العلوي -->
    <header class="glass-card sticky top-0 z-50 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <span class="text-3xl">🌌</span>
                <h1 class="text-2xl font-black bg-gradient-to-r from-purple-400 to-indigo-300 bg-clip-text text-transparent">مجرّة الروايات</h1>
            </div>
            <nav class="hidden md:flex space-x-8 space-x-reverse text-sm font-semibold text-gray-300">
                <a href="#" class="hover:text-purple-400 transition">الرئيسية</a>
                <a href="#" class="hover:text-purple-400 transition">الروايات</a>
                <a href="#" class="hover:text-purple-400 transition">التصنيفات</a>
                <a href="#" class="hover:text-purple-400 transition">الأكثر قراءة</a>
            </nav>
            <div>
                <button class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg shadow-purple-500/20 transition transform hover:-translate-y-0.5">
                    تسجيل الدخول
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي للموقع -->
    <main class="max-w-5xl mx-auto px-4 py-20 text-center my-auto">
        <div class="glass-card p-10 sm:p-14 rounded-3xl shadow-2xl border border-purple-500/20">
            <span class="text-6xl mb-6 inline-block">🚀</span>
            <h2 class="text-4xl sm:text-5xl font-black mb-6 tracking-tight">مرحباً بك في عالم الخيال والتشويق</h2>
            <p class="text-gray-300 text-lg sm:text-xl max-w-2xl mx-auto mb-10 leading-relaxed">
                وجهتك الأولى لقراءة أروع الروايات الحصرية، ومتابعة الفصول أولاً بأول بتصميم زجاجي فاخر يناسب شغفك للقراءة.
            </p>
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-8 py-4 rounded-xl shadow-lg transition transform hover:scale-105">
                    تصفح الروايات الآن
                </button>
                <button class="glass-card hover:bg-white/10 text-white font-bold px-8 py-4 rounded-xl transition">
                    انضم للمجتمع
                </button>
            </div>
        </div>
    </main>

    <!-- تذييل الصفحة -->
    <footer class="glass-card text-center py-6 text-gray-400 text-sm border-t border-gray-800">
        <p>جميع الحقوق محفوظة &copy; 2026 - مجرّة الروايات</p>
    </footer>

    <!-- تشغيل الخلفية المتحركة -->
    <script>
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x6366f1,
            backgroundColor: 0x030712,
            points: 12.00,
            maxDistance: 22.00,
            spacing: 17.00
        })
    </script>
</body>
</html>
